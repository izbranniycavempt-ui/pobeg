<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escape Game Telegram</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: 'Arial', sans-serif;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #1a1a2e, #16213e); /* Ночной город */
        }

        /* Интерфейс жизней */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }

        /* Скример */
        #screamer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 100;
            object-fit: cover;
        }

        /* Кнопка рестарта */
        #restartBtn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 20px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            z-index: 101;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div id="ui">Жизни: <span id="livesValue">3</span></div>
    <canvas id="gameCanvas"></canvas>
    
    <img id="screamer" src="https://ibb.co/Qg7r9xm" alt="SCREAMER">
    <button id="restartBtn" onclick="resetGame()">ПОПРОБОВАТЬ СНОВА</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const livesDisplay = document.getElementById('livesValue');
        const screamerImg = document.getElementById('screamer');
        const restartBtn = document.getElementById('restartBtn');

        // Настройки экрана
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Загрузка ресурсов
        const imgRunner = new Image();
        imgRunner.src = 'https://ibb.co/CsSyTmwD'; // Тот, кто убегает

        const imgChaser = new Image();
        imgChaser.src = 'https://ibb.co/WWQh9nSq'; // Тот, кто догоняет

        // Игровые переменные
        let lives = 3;
        let gameActive = true;
        let score = 0;
        let gravity = 0.8;
        let obstacles = [];
        let gameSpeed = 5;

        // Объект игрока
        const player = {
            x: 150,
            y: canvas.height - 150,
            width: 80,
            height: 100,
            dy: 0,
            jumpForce: -15,
            isGrounded: false
        };

        // Объект преследователя (бежит чуть сзади)
        const chaser = {
            x: 20,
            y: canvas.height - 150,
            width: 90,
            height: 110,
            isAttacking: false
        };

        // Класс препятствий
        class Obstacle {
            constructor() {
                this.width = 40 + Math.random() * 30;
                this.height = 40 + Math.random() * 50;
                this.x = canvas.width + 100;
                this.y = canvas.height - this.height - 50;
            }
            draw() {
                ctx.fillStyle = "#555"; // Цвет коробок/мусора
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Детализация препятствия
                ctx.strokeStyle = "#000";
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        // Обработка прыжка
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') jump();
        });
        window.addEventListener('touchstart', jump);

        function jump() {
            if (player.isGrounded && gameActive) {
                player.dy = player.jumpForce;
                player.isGrounded = false;
            }
        }

        function spawnObstacle() {
            if (gameActive && Math.random() < 0.02) {
                obstacles.push(new Obstacle());
            }
        }

        function triggerDamage() {
            lives--;
            livesDisplay.innerText = lives;
            
            // Визуальный эффект удара (преследователь делает рывок)
            chaser.x += 50;
            setTimeout(() => chaser.x = 20, 300);

            if (lives <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            gameActive = false;
            screamerImg.style.display = 'block';
            restartBtn.style.display = 'block';
            // Можно добавить звук крика здесь: new Audio('url_to_sound').play();
        }

        function resetGame() {
            lives = 3;
            livesDisplay.innerText = lives;
            obstacles = [];
            gameActive = true;
            screamerImg.style.display = 'none';
            restartBtn.style.display = 'none';
            animate();
        }

        function drawBackground() {
            // Рисуем упрощенные силуэты домов
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50); // Земля
            
            // Окна или детали зданий (статично для примера)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(100, canvas.height - 300, 100, 250);
            ctx.fillRect(300, canvas.height - 400, 120, 350);
            ctx.fillRect(600, canvas.height - 250, 80, 200);
        }

        function animate() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();

            // Гравитация и движение игрока
            player.dy += gravity;
            player.y += player.dy;

            if (player.y + player.height > canvas.height - 50) {
                player.y = canvas.height - 50 - player.height;
                player.isGrounded = true;
            }

            // Рисуем персонажей
            ctx.drawImage(imgRunner, player.x, player.y, player.width, player.height);
            ctx.drawImage(imgChaser, chaser.x, canvas.height - 150, chaser.width, chaser.height);

            // Препятствия
            spawnObstacle();
            obstacles.forEach((obs, index) => {
                obs.update();

                // Проверка столкновения
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    obstacles.splice(index, 1);
                    triggerDamage();
                }

                // Удаление лишних
                if (obs.x + obs.width < 0) {
                    obstacles.splice(index, 1);
                    score++;
                }
            });

            requestAnimationFrame(animate);
        }

        // Запуск после загрузки картинок
        imgRunner.onload = () => {
            animate();
        };

    </script>
</body>
</html>
