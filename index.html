<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horror Ultra Edition - Ultimate Fix</title>
    <style>
        /* ПОЛНЫЙ МАССИВНЫЙ СТИЛЬ */
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            overflow: hidden; 
            touch-action: none; 
            font-family: 'Courier New', monospace; 
        }
        canvas { 
            display: block; 
            filter: contrast(140%) brightness(80%) grayscale(0.3); 
        }
        
        #ui { 
            position: absolute; 
            top: 25px; 
            left: 25px; 
            color: #ff0000; 
            z-index: 10; 
            pointer-events: none; 
        }
        .stat { 
            background: linear-gradient(90deg, rgba(40,0,0,0.9), transparent); 
            padding: 12px 25px; 
            border-left: 6px solid #ff0000; 
            margin-bottom: 12px; 
            font-weight: bold; 
            letter-spacing: 3px;
            text-shadow: 3px 3px 6px #000;
            text-transform: uppercase;
        }

        #level-alert {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            color: #fff; 
            font-size: 80px; 
            font-weight: 900; 
            display: none; 
            z-index: 50;
            letter-spacing: 20px; 
            text-shadow: 0 0 40px #ff0000, 0 0 10px #fff;
            animation: pulseAlert 0.6s infinite;
        }

        #overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            background: #000; 
        }
        #screamer-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            filter: contrast(160%) saturate(250%); 
        }
        #death-content { 
            position: relative; 
            text-align: center; 
            animation: glitchEffect 0.2s infinite; 
        }
        h1 { 
            color: #fff; 
            font-size: 55px; 
            text-transform: uppercase; 
            margin: 0; 
            text-shadow: 0 0 25px #ff0000; 
        }
        
        #restart-btn { 
            margin-top: 50px; 
            padding: 30px 80px; 
            background: rgba(0,0,0,0.5); 
            color: #fff; 
            border: 5px solid #fff; 
            font-size: 28px; 
            cursor: pointer; 
            transition: 0.4s;
            text-transform: uppercase; 
            letter-spacing: 6px; 
            font-weight: 900;
        }
        #restart-btn:hover { 
            background: #ff0000; 
            border-color: #ff0000; 
            box-shadow: 0 0 60px #ff0000; 
        }

        @keyframes glitchEffect {
            0% { transform: translate(3px, -3px); opacity: 0.9; }
            50% { transform: translate(-3px, 3px); opacity: 1; }
            100% { transform: translate(0); }
        }
        @keyframes pulseAlert {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">ОБЪЕКТ: СБЕЖАЛ</div>
        <div class="stat">ДИСТАНЦИЯ: <span id="score">0</span>м</div>
        <div class="stat">ПУЛЬС: <span id="hp">100</span>%</div>
    </div>
    
    <div id="level-alert">LEVEL 2</div>
    <canvas id="c"></canvas>
    
    <div id="overlay">
        <img id="screamer-img" src="https://i.ibb.co/Qg7r9xm/image.png">
        <div id="death-content">
            <h1>ТЫ ОСТАЛСЯ ТАМ</h1>
            <button id="restart-btn">ВЕРНУТЬСЯ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restart-btn');
        const levelAlert = document.getElementById('level-alert');
        
        // РЕСУРСЫ
        const imgRunner = new Image(); 
        imgRunner.src = 'https://i.ibb.co/CsSyTmwD/image.png';
        
        const imgChaser1 = new Image(); 
        imgChaser1.src = 'https://i.ibb.co/WWQh9nSq/image.png';
        
        const imgChaser2 = new Image(); 
        imgChaser2.src = 'https://i.ibb.co/Xft0HNSp/image.png';
        
        const imgChaser3 = new Image(); 
        imgChaser3.src = 'https://i.ibb.co/Dgshgmc7/image.png';
        
        const imgBullet = new Image(); 
        imgBullet.src = 'https://i.ibb.co/Qj867Kvb/image.png'; // Твоя пуля
        
        // СТРАШНЫЕ ФОНЫ
        const bg1 = new Image(); 
        bg1.src = 'https://images.wallpapersden.com/image/download/dark-forest-creepy-night_am5oa2a2UmZqaraWkpJRma2trWlnZ2U.jpg'; 
        
        const bg2 = new Image(); 
        bg2.src = 'https://p4.wallpaperbetter.com/wallpaper/704/443/404/asylum-horror-dark-spooky-wallpaper-preview.jpg';

        let w, h, p, obs, bullets, score, hp, gameActive, speed, frame, particles = [], dust = [], shake = 0, level = 1;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            
            p = { 
                x: 80, 
                y: h - 250, 
                w: 100, 
                h: 150, 
                dy: 0, 
                g: 0.9, 
                jump: -19, 
                onG: false, 
                rot: 0 
            };

            obs = []; 
            bullets = []; 
            particles = []; 
            dust = [];
            score = 0; 
            hp = 100; 
            speed = 9; 
            frame = 0; 
            gameActive = true; 
            shake = 0; 
            level = 1;
            
            // Пыль/туман
            for(let i=0; i<80; i++) {
                dust.push({ 
                    x: Math.random()*w, 
                    y: Math.random()*h, 
                    s: Math.random()*3, 
                    o: Math.random(), 
                    sm: Math.random() * 0.6 + 0.2 
                });
            }

            overlay.style.display = 'none';
            levelAlert.style.display = 'none';
            loop();
        }

        function createBlood(x, y) {
            for(let i=0; i<30; i++) {
                particles.push({
                    x: x, 
                    y: y, 
                    vx: (Math.random()-0.5)*20, 
                    vy: (Math.random()-0.5)*20, 
                    life: 1, 
                    c: '#700000',
                    s: Math.random()*12
                });
            }
        }

        function drawWorld() {
            let currentBG = (level === 1) ? bg1 : bg2;
            
            if(currentBG.complete) {
                let scroll = (frame * speed * 0.4) % w;
                ctx.drawImage(currentBG, -scroll, 0, w, h);
                ctx.drawImage(currentBG, w - scroll, 0, w, h);
            }

            // Рендер пыли
            ctx.fillStyle = "#ffffff";
            for(let i = 0; i < dust.length; i++) {
                let d = dust[i];
                d.x -= (speed * d.sm);
                if(d.x < 0) d.x = w;
                ctx.globalAlpha = d.o * 0.3;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.s, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Земля
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, h-60, w, 60);
        }

        function loop() {
            if(!gameActive) return;
            ctx.save();
            
            if(shake > 0) {
                ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2);
                shake *= 0.93;
            }

            drawWorld();

            // Переход на 2 уровень (50 очков)
            if(Math.floor(score/10) >= 50 && level === 1) {
                level = 2;
                levelAlert.style.display = 'block';
                setTimeout(() => { levelAlert.style.display = 'none'; }, 2500);
            }

            // Кровь
            for(let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx; 
                pt.y += pt.vy; 
                pt.life -= 0.025;
                if(pt.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = pt.c;
                ctx.globalAlpha = pt.life;
                ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
            }
            ctx.globalAlpha = 1;

            // Игрок
            p.dy += p.g; 
            p.y += p.dy;
            if(p.y + p.h > h - 60) { 
                p.y = h - 60 - p.h; 
                p.dy = 0; 
                p.onG = true; 
            } else {
                p.onG = false;
            }
            
            ctx.save();
            ctx.translate(p.x + p.w/2, p.y + p.h/2);
            ctx.rotate(p.onG ? Math.sin(frame*0.15)*0.04 : p.dy*0.03);
            ctx.drawImage(imgRunner, -p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();

            // Враги (Безопасный старт включен)
            if(frame > 130 && frame % 90 === 0) {
                let enemyType = (level === 2) ? imgChaser3 : (Math.random() > 0.5 ? imgChaser2 : imgChaser1);
                obs.push({ 
                    x: w, 
                    y: h - 190 - (Math.random()*60), 
                    w: 120, 
                    h: 120, 
                    s: speed + (Math.random()*5),
                    img: enemyType,
                    canFire: (level === 2),
                    fired: false
                });
            }
            
            for(let i = obs.length - 1; i >= 0; i--) {
                let o = obs[i];
                o.x -= o.s;
                ctx.drawImage(o.img, o.x, o.y + Math.sin(frame*0.1)*12, o.w, o.h);
                
                // Стрельба ТОЛЬКО ТВОИМ ОРУЖИЕМ
                if(o.canFire && !o.fired && o.x < w - 250) {
                    bullets.push({
                        x: o.x, 
                        y: o.y + 40,
                        v: (speed + 9),
                        w: 70, 
                        h: 70
                    });
                    o.fired = true;
                }

                if(p.x < o.x + o.w - 40 && p.x + p.w > o.x + 40 && p.y < o.y + o.h - 30 && p.y + p.h > o.y + 30) {
                    obs.splice(i, 1);
                    hp -= 34; 
                    shake = 50;
                    createBlood(p.x + 50, p.y + 70);
                    document.getElementById('hp').innerText = Math.max(0, Math.floor(hp));
                    if(hp <= 0) { gameActive = false; setTimeout(() => { overlay.style.display = 'flex'; }, 200); }
                }
                if(o.x < -300) obs.splice(i, 1);
            }

            // Пули (Твоя картинка)
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x -= b.v;
                ctx.drawImage(imgBullet, b.x, b.y, b.w, b.h);
                
                if(p.x < b.x + b.w - 20 && p.x + p.w > b.x + 20 && p.y < b.y + b.h - 20 && p.y + p.h > b.y + 20) {
                    bullets.splice(i, 1);
                    hp -= 25; 
                    shake = 35;
                    createBlood(p.x + 50, p.y + 50);
                    document.getElementById('hp').innerText = Math.max(0, Math.floor(hp));
                    if(hp <= 0) { gameActive = false; setTimeout(() => { overlay.style.display = 'flex'; }, 200); }
                }
                if(b.x < -150) bullets.splice(i, 1);
            }

            // ВЕРНУЛ ФОНАРИК (Эффект темноты с лучом)
            let grad = ctx.createRadialGradient(p.x + p.w/2, p.y + p.h/2, 20, p.x + p.w/2, p.y + p.h/2, 600);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.4, 'rgba(0,0,0,0.2)');
            grad.addColorStop(1, 'rgba(0,0,0,0.98)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            score++; 
            speed += 0.0025; 
            frame++;
            document.getElementById('score').innerText = Math.floor(score/10);
            
            ctx.restore();
            requestAnimationFrame(loop);
        }
        
        function jump() { 
            if(p.onG && gameActive) { 
                p.dy = p.jump; 
                p.onG = false; 
            } 
        }

        window.onclick = jump;
        window.ontouchstart = (e) => { 
            if(e.target !== restartBtn) { e.preventDefault(); jump(); } 
        };
        restartBtn.onclick = (e) => { 
            e.stopPropagation(); 
            init(); 
        };

        imgRunner.onload = init;
    </script>
</body>
</html>
