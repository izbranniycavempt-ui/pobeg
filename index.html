<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horror Ultra Edition</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'Courier New', monospace; }
        canvas { display: block; filter: contrast(120%) brightness(80%) sepia(20%); }
        #ui { position: absolute; top: 25px; left: 25px; color: #ff0000; z-index: 10; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.6); padding: 5px 15px; border-left: 3px solid red; margin-bottom: 5px; font-weight: bold; }
        
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; background: #000; }
        #screamer-img { width: 100%; height: 100%; object-fit: cover; position: absolute; filter: contrast(150%); }
        
        #death-content { position: relative; text-align: center; animation: glitch 0.3s infinite; }
        h1 { color: #fff; font-size: 45px; text-transform: uppercase; margin: 0; text-shadow: 4px 4px red; }
        
        #restart-btn { 
            margin-top: 30px; padding: 20px 60px; background: transparent; color: white; 
            border: 2px solid white; font-size: 22px; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 5px;
        }
        #restart-btn:hover { background: white; color: black; }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">СТАТУС: ВЫЖИВАНИЕ</div>
        <div class="stat">ДИСТАНЦИЯ: <span id="score">0</span>м</div>
        <div class="stat">ЦЕЛОСТНОСТЬ: <span id="hp">100</span>%</div>
    </div>
    
    <canvas id="c"></canvas>
    
    <div id="overlay">
        <img id="screamer-img" src="https://i.ibb.co/Qg7r9xm/image.png">
        <div id="death-content">
            <h1>ОБЪЕКТ ПОТЕРЯН</h1>
            <button id="restart-btn">ПОВТОР</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay'), restartBtn = document.getElementById('restart-btn');
        
        const imgRunner = new Image(); imgRunner.src = 'https://i.ibb.co/CsSyTmwD/image.png';
        const imgChaser = new Image(); imgChaser.src = 'https://i.ibb.co/WWQh9nSq/image.png';

        let w, h, p, obs, score, hp, gameActive, speed, frame, particles = [], shake = 0;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            p = { x: 70, y: h - 220, w: 85, h: 130, dy: 0, g: 0.75, jump: -17, onG: false, rot: 0 };
            obs = []; particles = []; score = 0; hp = 100; speed = 8; frame = 0; gameActive = true;
            overlay.style.display = 'none';
            loop();
        }

        function createPart(x, y, color, type) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x, y, 
                    vx: (Math.random()-0.5)*10, 
                    vy: (Math.random()-0.5)*10, 
                    life: 1, 
                    c: color,
                    s: Math.random()*5,
                    type: type
                });
            }
        }

        function drawBackground() {
            // Глубокий градиент ночи
            let bgGrad = ctx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, '#050000');
            bgGrad.addColorStop(1, '#1a0505');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // Параллакс деревья/тени
            ctx.fillStyle = '#0a0000';
            for(let i=0; i<5; i++) {
                let x = (i * 400 - frame * 2) % (w + 400);
                ctx.fillRect(x, h-350, 40, 300);
            }

            // Пол с текстурой
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, h-60, w, 60);
            ctx.strokeStyle = '#220000';
            for(let i=0; i<w; i+=50) {
                ctx.beginPath();
                ctx.moveTo(i - (frame*speed)%50, h-60);
                ctx.lineTo(i - (frame*speed)%50 - 20, h);
                ctx.stroke();
            }
        }

        function loop() {
            if(!gameActive) return;
            ctx.save();
            if(shake > 0) { ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2); shake *= 0.9; }
            
            drawBackground();

            // Частицы
            particles.forEach((pt, i) => {
                pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.02;
                if(pt.life <= 0) particles.splice(i, 1);
                ctx.fillStyle = pt.c;
                ctx.globalAlpha = pt.life;
                ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
            });
            ctx.globalAlpha = 1;

            // Игрок (Бегун)
            p.dy += p.g; p.y += p.dy;
            if(p.y + p.h > h - 60) { 
                p.y = h - 60 - p.h; p.dy = 0; p.onG = true; 
                if(frame % 5 === 0) createPart(p.x + 20, h-60, '#333', 'dust');
            }
            
            // Динамический наклон при беге/прыжке
            p.rot = p.onG ? Math.sin(frame*0.15)*0.05 : p.dy*0.02;
            ctx.save();
            ctx.translate(p.x + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rot);
            ctx.drawImage(imgRunner, -p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();

            // Препятствия (Преследователь)
            if(frame % 85 === 0) obs.push({ x: w, y: h - 160, w: 100, h: 100, s: speed + Math.random()*2 });
            
            obs.forEach((o, i) => {
                o.x -= o.s;
                // Эффект парения преследователя
                let hover = Math.sin(frame*0.1)*10;
                ctx.drawImage(imgChaser, o.x, o.y + hover, o.w, o.h);
                
                // Столкновение
                if(p.x < o.x + o.w - 30 && p.x + p.w > o.x + 30 && p.y < o.y + o.h && p.y + p.h > o.y) {
                    obs.splice(i, 1); hp -= 35; shake = 25;
                    createPart(p.x + 40, p.y + 40, 'red', 'blood');
                    document.getElementById('hp').innerText = Math.max(0, hp);
                    if(hp <= 0) { gameActive = false; setTimeout(showDeath, 100); }
                }
                if(o.x < -150) obs.splice(i, 1);
            });

            // Свет фонарика 2.0
            let grad = ctx.createRadialGradient(p.x+p.w/2, p.y+p.h/2, 20, p.x+p.w/2, p.y+p.h/2, 600);
            grad.addColorStop(0, 'rgba(255,255,230,0.15)');
            grad.addColorStop(0.5, 'rgba(0,0,0,0.4)');
            grad.addColorStop(1, 'rgba(0,0,0,0.98)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,w,h);

            // Пост-эффект шума
            if(frame % 2 === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.02)';
                ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
            }

            score++; speed += 0.0015; frame++;
            document.getElementById('score').innerText = Math.floor(score/10);
            ctx.restore();
            requestAnimationFrame(loop);
        }

        function showDeath() {
            overlay.style.display = 'flex';
            if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 500]);
        }
        
        function jump() { if(p.onG && gameActive) { p.dy = p.jump; p.onG = false; } }

        window.addEventListener('touchstart', (e) => { if(e.target !== restartBtn) { e.preventDefault(); jump(); } }, {passive: false});
        window.addEventListener('mousedown', (e) => { if(e.target !== restartBtn) jump(); });
        restartBtn.onclick = (e) => { e.stopPropagation(); init(); };

        imgRunner.onload = init;
    </script>
</body>
</html>
