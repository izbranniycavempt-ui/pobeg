<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horror Ultra - Ultimate Full Edition</title>
    <style>
        /* ПОЛНЫЙ ДЕТАЛИЗИРОВАННЫЙ СТИЛЬ */
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            overflow: hidden; 
            touch-action: none; 
            font-family: 'Courier New', monospace; 
        }
        canvas { 
            display: block; 
            filter: contrast(140%) brightness(80%) grayscale(0.3); 
        }
        
        #ui { 
            position: absolute; 
            top: 25px; 
            left: 25px; 
            color: #ff0000; 
            z-index: 10; 
            pointer-events: none; 
        }
        .stat { 
            background: linear-gradient(90deg, rgba(40,0,0,0.9), transparent); 
            padding: 12px 25px; 
            border-left: 6px solid #ff0000; 
            margin-bottom: 12px; 
            font-weight: bold; 
            letter-spacing: 3px;
            text-shadow: 3px 3px 6px #000;
            text-transform: uppercase;
        }

        #level-alert {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            color: #fff; 
            font-size: 80px; 
            font-weight: 900; 
            display: none; 
            z-index: 50;
            letter-spacing: 20px; 
            text-shadow: 0 0 40px #ff0000, 0 0 10px #fff;
            animation: pulseAlert 0.6s infinite;
        }

        #overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            background: #000; 
        }
        #screamer-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            filter: contrast(160%) saturate(250%); 
        }
        #death-content { 
            position: relative; 
            text-align: center; 
            animation: glitchEffect 0.2s infinite; 
        }
        h1 { 
            color: #fff; 
            font-size: 55px; 
            text-transform: uppercase; 
            margin: 0; 
            text-shadow: 0 0 25px #ff0000; 
        }
        
        #restart-btn { 
            margin-top: 50px; 
            padding: 30px 80px; 
            background: rgba(0,0,0,0.5); 
            color: #fff; 
            border: 5px solid #fff; 
            font-size: 28px; 
            cursor: pointer; 
            transition: 0.4s;
            text-transform: uppercase; 
            letter-spacing: 6px; 
            font-weight: 900;
        }
        #restart-btn:hover { 
            background: #ff0000; 
            border-color: #ff0000; 
            box-shadow: 0 0 60px #ff0000; 
        }

        @keyframes glitchEffect {
            0% { transform: translate(3px, -3px); opacity: 0.9; }
            50% { transform: translate(-3px, 3px); opacity: 1; }
            100% { transform: translate(0); }
        }
        @keyframes pulseAlert {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">ОБЪЕКТ: СБЕЖАЛ</div>
        <div class="stat">ДИСТАНЦИЯ: <span id="score">0</span>м</div>
        <div class="stat">ПУЛЬС: <span id="hp">100</span>%</div>
    </div>
    
    <div id="level-alert">LEVEL 2</div>
    <canvas id="c"></canvas>
    
    <div id="overlay">
        <img id="screamer-img" src="https://i.ibb.co/Qg7r9xm/image.png">
        <div id="death-content">
            <h1>ТЫ ОСТАЛСЯ ТАМ</h1>
            <button id="restart-btn">ВЕРНУТЬСЯ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restart-btn');
        const levelAlert = document.getElementById('level-alert');
        
        // --- ПОЛНЫЙ СПИСОК РЕСУРСОВ ---
        const assets = {
            runner: new Image(),
            chaser1: new Image(),
            chaser2: new Image(),
            chaser3: new Image(),
            bullet: new Image(),
            bg1: new Image(),
            bg2: new Image()
        };

        // Твои персонажи и снаряд
        assets.runner.src = 'https://i.ibb.co/CsSyTmwD/image.png';
        assets.chaser1.src = 'https://i.ibb.co/WWQh9nSq/image.png';
        assets.chaser2.src = 'https://i.ibb.co/Xft0HNSp/image.png';
        assets.chaser3.src = 'https://i.ibb.co/Dgshgmc7/image.png';
        assets.bullet.src = 'https://i.ibb.co/Qj867Kvb/image.png';

        // Страшные фоны (Лес и Психбольница)
        assets.bg1.src = 'https://images.wallpapersden.com/image/download/dark-forest-creepy-night_am5oa2a2UmZqaraWkpJRma2trWlnZ2U.jpg'; 
        assets.bg2.src = 'https://p4.wallpaperbetter.com/wallpaper/704/443/404/asylum-horror-dark-spooky-wallpaper-preview.jpg';

        let w, h, p, obs, bullets, score, hp, gameActive, speed, frame, particles = [], dust = [], shake = 0, level = 1;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            
            p = { 
                x: 80, 
                y: h - 250, 
                w: 100, 
                h: 150, 
                dy: 0, 
                g: 0.9, 
                jump: -19, 
                onG: false 
            };

            obs = []; 
            bullets = []; 
            particles = []; 
            dust = [];
            score = 0; 
            hp = 100; 
            speed = 9; 
            frame = 0; 
            gameActive = true; 
            shake = 0; 
            level = 1;
            
            // Генерация частиц тумана/пыли
            for(let i=0; i<80; i++) {
                dust.push({ 
                    x: Math.random()*w, 
                    y: Math.random()*h, 
                    s: Math.random()*3, 
                    o: Math.random(), 
                    sm: Math.random() * 0.6 + 0.2 
                });
            }

            overlay.style.display = 'none';
            levelAlert.style.display = 'none';
            loop();
        }

        function createBlood(x, y) {
            for(let i=0; i<30; i++) {
                particles.push({ 
                    x: x, 
                    y: y, 
                    vx: (Math.random()-0.5)*20, 
                    vy: (Math.random()-0.5)*20, 
                    life: 1, 
                    c: '#700000', 
                    s: Math.random()*12 
                });
            }
        }

        function drawWorld() {
            let currentBG = (level === 1) ? assets.bg1 : assets.bg2;
            
            // Отрисовка зацикленного фона
            if(currentBG.complete && currentBG.naturalWidth !== 0) {
                let scroll = (frame * speed * 0.4) % w;
                ctx.drawImage(currentBG, -scroll, 0, w, h);
                ctx.drawImage(currentBG, w - scroll, 0, w, h);
            } else {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
            }

            // Отрисовка частиц тумана
            ctx.fillStyle = "#ffffff";
            for(let i = 0; i < dust.length; i++) {
                let d = dust[i];
                d.x -= (speed * d.sm);
                if(d.x < 0) d.x = w;
                ctx.globalAlpha = d.o * 0.3;
                ctx.beginPath(); 
                ctx.arc(d.x, d.y, d.s, 0, Math.PI*2); 
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Отрисовка земли
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, h-60, w, 60);
        }

        function loop() {
            if(!gameActive) return;
            ctx.save();
            
            // Тряска экрана при попадании
            if(shake > 0) {
                ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2);
                shake *= 0.93;
            }

            drawWorld();

            // Логика перехода на уровень 2
            if(Math.floor(score/10) >= 50 && level === 1) {
                level = 2;
                levelAlert.style.display = 'block';
                setTimeout(() => { levelAlert.style.display = 'none'; }, 2500);
            }

            // Отрисовка частиц крови
            for(let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx; 
                pt.y += pt.vy; 
                pt.life -= 0.025;
                if(pt.life <= 0) { 
                    particles.splice(i, 1); 
                    continue; 
                }
                ctx.fillStyle = pt.c; 
                ctx.globalAlpha = pt.life;
                ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
            }
            ctx.globalAlpha = 1;

            // Физика и отрисовка игрока
            p.dy += p.g; 
            p.y += p.dy;
            if(p.y + p.h > h - 60) { 
                p.y = h - 60 - p.h; 
                p.dy = 0; 
                p.onG = true; 
            } else { 
                p.onG = false; 
            }
            
            ctx.save();
            ctx.translate(p.x + p.w/2, p.y + p.h/2);
            ctx.rotate(p.onG ? Math.sin(frame*0.15)*0.04 : p.dy*0.03);
            if(assets.runner.complete) {
                ctx.drawImage(assets.runner, -p.w/2, -p.h/2, p.w, p.h);
            }
            ctx.restore();

            // Спавн врагов
            if(frame > 130 && frame % 90 === 0) {
                let enemyImg = (level === 2) ? assets.chaser3 : (Math.random() > 0.5 ? assets.chaser2 : assets.chaser1);
                obs.push({ 
                    x: w, 
                    y: h - 190 - (Math.random()*60), 
                    w: 120, 
                    h: 120, 
                    s: speed + (Math.random()*5), 
                    img: enemyImg, 
                    canFire: (level === 2), 
                    fired: false 
                });
            }
            
            // Обработка врагов
            for(let i = obs.length - 1; i >= 0; i--) {
                let o = obs[i]; 
                o.x -= o.s;
                if(o.img.complete) {
                    ctx.drawImage(o.img, o.x, o.y + Math.sin(frame*0.1)*12, o.w, o.h);
                }
                
                // Стрельба врага (твой снаряд)
                if(o.canFire && !o.fired && o.x < w - 250) {
                    bullets.push({ 
                        x: o.x, 
                        y: o.y + 40, 
                        v: (speed + 9), 
                        w: 70, 
                        h: 70 
                    });
                    o.fired = true;
                }

                // Столкновение с врагом
                if(p.x < o.x + o.w - 40 && p.x + p.w > o.x + 40 && p.y < o.y + o.h - 30 && p.y + p.h > o.y + 30) {
                    obs.splice(i, 1); 
                    hp -= 34; 
                    shake = 50; 
                    createBlood(p.x + 50, p.y + 70);
                    document.getElementById('hp').innerText = Math.max(0, Math.floor(hp));
                    if(hp <= 0) { 
                        gameActive = false; 
                        setTimeout(() => { overlay.style.display = 'flex'; }, 200); 
                    }
                }
                if(o.x < -300) obs.splice(i, 1);
            }

            // Обработка снарядов
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; 
                b.x -= b.v;
                if(assets.bullet.complete) {
                    ctx.drawImage(assets.bullet, b.x, b.y, b.w, b.h);
                }
                
                // Столкновение со снарядом
                if(p.x < b.x + b.w - 20 && p.x + p.w > b.x + 20 && p.y < b.y + b.h - 20 && p.y + p.h > b.y + 20) {
                    bullets.splice(i, 1); 
                    hp -= 25; 
                    shake = 35; 
                    createBlood(p.x + 50, p.y + 50);
                    document.getElementById('hp').innerText = Math.max(0, Math.floor(hp));
                    if(hp <= 0) { 
                        gameActive = false; 
                        setTimeout(() => { overlay.style.display = 'flex'; }, 200); 
                    }
                }
                if(b.x < -150) bullets.splice(i, 1);
            }

            // ЭФФЕКТ ФОНАРИКА (Свет вокруг игрока)
            let grad = ctx.createRadialGradient(p.x + p.w/2, p.y + p.h/2, 20, p.x + p.w/2, p.y + p.h/2, 600);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.4, 'rgba(0,0,0,0.2)');
            grad.addColorStop(1, 'rgba(0,0,0,0.98)');
            ctx.fillStyle = grad; 
            ctx.fillRect(0, 0, w, h);

            // Обновление UI и прогресса
            score++; 
            speed += 0.0025; 
            frame++;
            document.getElementById('score').innerText = Math.floor(score/10);
            
            ctx.restore();
            requestAnimationFrame(loop);
        }
        
        // Управление прыжком
        function jump() { 
            if(p.onG && gameActive) { 
                p.dy = p.jump; 
                p.onG = false; 
            } 
        }

        window.onclick = jump;
        window.ontouchstart = (e) => { 
            if(e.target !== restartBtn) { 
                e.preventDefault(); 
                jump(); 
            } 
        };
        
        restartBtn.onclick = (e) => { 
            e.stopPropagation(); 
            init(); 
        };

        // Запуск после загрузки игрока
        assets.runner.onload = init;
    </script>
</body>
</html>
