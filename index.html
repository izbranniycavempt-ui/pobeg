<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horror Ultra Edition - Ultimate Massive Code</title>
    <style>
        /* ПОЛНЫЙ СТИЛЬ - БЕЗ ОПТИМИЗАЦИИ */
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            overflow: hidden; 
            touch-action: none; 
            font-family: 'Courier New', monospace; 
        }
        canvas { 
            display: block; 
            filter: contrast(130%) brightness(90%) grayscale(0.2); 
        }
        
        #ui { 
            position: absolute; 
            top: 25px; 
            left: 25px; 
            color: #ff0000; 
            z-index: 10; 
            pointer-events: none; 
        }
        .stat { 
            background: linear-gradient(90deg, rgba(30,0,0,0.9), transparent); 
            padding: 10px 20px; 
            border-left: 5px solid #ff0000; 
            margin-bottom: 10px; 
            font-weight: bold; 
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px #000;
        }

        #level-alert {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            color: white; 
            font-size: 70px; 
            font-weight: 900; 
            display: none; 
            z-index: 50;
            letter-spacing: 15px; 
            text-shadow: 0 0 30px #fff, 0 0 10px #ff0000;
            animation: pulse 0.5s infinite;
        }

        #overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            background: #000; 
        }
        #screamer-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            filter: contrast(150%) saturate(200%); 
        }
        #death-content { 
            position: relative; 
            text-align: center; 
            animation: glitch 0.15s infinite; 
        }
        h1 { 
            color: #fff; 
            font-size: 50px; 
            text-transform: uppercase; 
            margin: 0; 
            text-shadow: 0 0 20px #ff0000; 
        }
        
        #restart-btn { 
            margin-top: 40px; 
            padding: 25px 70px; 
            background: transparent; 
            color: white; 
            border: 4px solid white; 
            font-size: 26px; 
            cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase; 
            letter-spacing: 5px; 
            font-weight: 900;
        }
        #restart-btn:hover { 
            background: #ff0000; 
            border-color: #ff0000; 
            box-shadow: 0 0 50px #ff0000; 
        }

        @keyframes glitch {
            0% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            100% { transform: translate(0); }
        }
        @keyframes pulse {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">ОБЪЕКТ: СБЕЖАЛ</div>
        <div class="stat">ДИСТАНЦИЯ: <span id="score">0</span>м</div>
        <div class="stat">ПУЛЬС: <span id="hp">100</span>%</div>
    </div>
    
    <div id="level-alert">LEVEL 2</div>
    <canvas id="c"></canvas>
    
    <div id="overlay">
        <img id="screamer-img" src="https://i.ibb.co/Qg7r9xm/image.png">
        <div id="death-content">
            <h1>ТЫ ОСТАЛСЯ ТАМ</h1>
            <button id="restart-btn">ВЕРНУТЬСЯ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restart-btn');
        const levelAlert = document.getElementById('level-alert');
        
        // ВСЕ СПРАЙТЫ (PNG БЕЗ ФОНА)
        const imgRunner = new Image(); 
        imgRunner.src = 'https://i.ibb.co/CsSyTmwD/image.png';
        
        const imgChaser1 = new Image(); 
        imgChaser1.src = 'https://i.ibb.co/WWQh9nSq/image.png';
        
        const imgChaser2 = new Image(); 
        imgChaser2.src = 'https://i.ibb.co/Xft0HNSp/image.png';
        
        const imgChaser3 = new Image(); 
        imgChaser3.src = 'https://i.ibb.co/Dgshgmc7/image.png';
        
        const imgBullet = new Image(); 
        imgBullet.src = 'https://i.ibb.co/Qj867Kvb/image.png'; // Тот самый PNG снаряда
        
        // РАБОЧИЕ ССЫЛКИ НА ФОН (ЧТОБЫ НЕ БЫЛО ОШИБОК)
        const bgForest = new Image(); 
        bgForest.src = 'https://wallpaperaccess.com/full/1162446.jpg'; 
        
        const bgFactory = new Image(); 
        bgFactory.src = 'https://wallpaperaccess.com/full/439751.jpg';

        let w, h, p, obs, bullets, score, hp, gameActive, speed, frame, particles = [], dust = [], shake = 0, level = 1;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            
            p = { 
                x: 80, 
                y: h - 250, 
                w: 90, 
                h: 140, 
                dy: 0, 
                g: 0.85, 
                jump: -18, 
                onG: false, 
                rot: 0 
            };

            obs = []; 
            bullets = []; 
            particles = []; 
            dust = [];
            score = 0; 
            hp = 100; 
            speed = 9; 
            frame = 0; 
            gameActive = true; 
            shake = 0; 
            level = 1;
            
            // Пыль в воздухе для атмосферы
            for(let i=0; i<60; i++) {
                dust.push({ 
                    x: Math.random()*w, 
                    y: Math.random()*h, 
                    s: Math.random()*2, 
                    o: Math.random(), 
                    speedMult: Math.random() * 0.5 + 0.1 
                });
            }

            overlay.style.display = 'none';
            levelAlert.style.display = 'none';
            loop();
        }

        function createBlood(x, y) {
            for(let i=0; i<25; i++) {
                particles.push({
                    x: x, 
                    y: y, 
                    vx: (Math.random()-0.5)*18, 
                    vy: (Math.random()-0.5)*18, 
                    life: 1, 
                    c: '#ff0000',
                    s: Math.random()*10
                });
            }
        }

        function drawWorld() {
            let currentBG = (level === 1) ? bgForest : bgFactory;
            
            // Плавная прокрутка фона
            if(currentBG.complete) {
                let scroll = (frame * speed * 0.3) % w;
                ctx.drawImage(currentBG, -scroll, 0, w, h);
                ctx.drawImage(currentBG, w - scroll, 0, w, h);
            } else {
                ctx.fillStyle = (level === 1) ? '#050000' : '#0a0a0a';
                ctx.fillRect(0, 0, w, h);
            }

            // Эффекты частиц пыли
            ctx.fillStyle = "#fff";
            for(let i = 0; i < dust.length; i++) {
                let d = dust[i];
                d.x -= (speed * d.speedMult);
                if(d.x < 0) d.x = w;
                ctx.globalAlpha = d.o * 0.4;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.s, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Пол и дорога
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, h-60, w, 60);
        }

        function loop() {
            if(!gameActive) return;
            ctx.save();
            
            // Эффект тряски экрана
            if(shake > 0) {
                ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2);
                shake *= 0.92;
            }

            drawWorld();

            // Логика перехода на Level 2
            if(Math.floor(score/10) >= 50 && level === 1) {
                level = 2;
                levelAlert.style.display = 'block';
                setTimeout(() => { levelAlert.style.display = 'none'; }, 2500);
            }

            // Рендеринг крови
            for(let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx; 
                pt.y += pt.vy; 
                pt.life -= 0.02;
                if(pt.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = pt.c;
                ctx.globalAlpha = pt.life;
                ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
            }
            ctx.globalAlpha = 1;

            // Физика игрока
            p.dy += p.g; 
            p.y += p.dy;
            if(p.y + p.h > h - 60) { 
                p.y = h - 60 - p.h; 
                p.dy = 0; 
                p.onG = true; 
            } else {
                p.onG = false;
            }
            
            // Анимация бега и прыжка
            ctx.save();
            ctx.translate(p.x + p.w/2, p.y + p.h/2);
            let pRot = p.onG ? Math.sin(frame*0.15)*0.03 : p.dy*0.02;
            ctx.rotate(pRot);
            ctx.drawImage(imgRunner, -p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();

            // Спавн преследователей
            if(frame > 120 && frame % 85 === 0) {
                let eImg = (level === 2) ? imgChaser3 : (Math.random() > 0.5 ? imgChaser2 : imgChaser1);
                obs.push({ 
                    x: w, 
                    y: h - 180 - (Math.random()*50), 
                    w: 110, 
                    h: 110, 
                    s: speed + (Math.random()*4),
                    img: eImg,
                    canShoot: (level === 2),
                    hasShot: false
                });
            }
            
            // Цикл обработки преследователей
            for(let i = obs.length - 1; i >= 0; i--) {
                let o = obs[i];
                o.x -= o.s;
                ctx.drawImage(o.img, o.x, o.y + Math.sin(frame*0.1)*10, o.w, o.h);
                
                // Стрельба (Level 2)
                if(o.canShoot && !o.hasShot && o.x < w - 200) {
                    bullets.push({
                        x: o.x, 
                        y: o.y + 40,
                        vx: (speed + 8),
                        w: 60, 
                        h: 60
                    });
                    o.hasShot = true;
                }

                // Коллизия с игроком
                if(p.x < o.x + o.w - 35 && p.x + p.w > o.x + 35 && p.y < o.y + o.h - 25 && p.y + p.h > o.y + 25) {
                    obs.splice(i, 1);
                    hp -= 34; 
                    shake = 40;
                    createBlood(p.x + 50, p.y + 70);
                    document.getElementById('hp').innerText = Math.max(0, Math.floor(hp));
                    if(hp <= 0) { 
                        gameActive = false; 
                        setTimeout(() => { overlay.style.display = 'flex'; }, 200); 
                    }
                }
                if(o.x < -300) obs.splice(i, 1);
            }

            // Обработка снарядов
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x -= b.vx;
                ctx.drawImage(imgBullet, b.x, b.y, b.w, b.h);
                
                // Коллизия со снарядом
                if(p.x < b.x + b.w - 15 && p.x + p.w > b.x + 15 && p.y < b.y + b.h - 15 && p.y + p.h > b.y + 15) {
                    bullets.splice(i, 1);
                    hp -= 20; 
                    shake = 30;
                    createBlood(p.x + 50, p.y + 50);
                    document.getElementById('hp').innerText = Math.max(0, Math.floor(hp));
                    if(hp <= 0) { 
                        gameActive = false; 
                        setTimeout(() => { overlay.style.display = 'flex'; }, 200); 
                    }
                }
                if(b.x < -100) bullets.splice(i, 1);
            }

            // Эффект света фонаря
            let lightGradient = ctx.createRadialGradient(p.x+p.w/2, p.y+p.h/2, 10, p.x+p.w/2, p.y+p.h/2, 750);
            lightGradient.addColorStop(0, 'rgba(255,255,230,0.18)');
            lightGradient.addColorStop(1, 'rgba(0,0,0,1)');
            ctx.fillStyle = lightGradient;
            ctx.fillRect(0,0,w,h);

            score++; 
            speed += 0.002; 
            frame++;
            document.getElementById('score').innerText = Math.floor(score/10);
            
            ctx.restore();
            requestAnimationFrame(loop);
        }
        
        function jump() { 
            if(p.onG && gameActive) { 
                p.dy = p.jump; 
                p.onG = false; 
            } 
        }

        // Управление
        window.onclick = jump;
        window.ontouchstart = (e) => { 
            if(e.target !== restartBtn) { 
                e.preventDefault(); 
                jump(); 
            } 
        };
        restartBtn.onclick = (e) => { 
            e.stopPropagation(); 
            init(); 
        };

        imgRunner.onload = init;
    </script>
</body>
</html>
