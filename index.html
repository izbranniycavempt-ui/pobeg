<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horror Run</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: #ff0000; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 5px #000; z-index: 10; pointer-events: none; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; background: #000; }
        #screamer-img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #death-text { position: relative; color: white; font-size: 30px; text-transform: uppercase; margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 10px red; }
        #restart-btn { position: relative; padding: 15px 40px; background: red; color: white; border: none; font-size: 20px; cursor: pointer; font-weight: bold; border-radius: 5px; box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        .shake { animation: shakeAnim 0.2s infinite; }
        @keyframes shakeAnim { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }
    </style>
</head>
<body>
    <div id="ui">HP: <span id="hp">100%</span> | СЧЕТ: <span id="score">0</span></div>
    <canvas id="c"></canvas>
    <div id="overlay">
        <img id="screamer-img" src="https://i.ibb.co/Qg7r9xm/image.png">
        <div id="death-text">ОН ТЕБЯ ПОЙМАЛ</div>
        <button id="restart-btn">ПОПРОБОВАТЬ СНОВА</button>
    </div>

    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay'), restartBtn = document.getElementById('restart-btn');
        
        const imgRunner = new Image(); imgRunner.src = 'https://i.ibb.co/CsSyTmwD/image.png';
        const imgChaser = new Image(); imgChaser.src = 'https://i.ibb.co/WWQh9nSq/image.png';

        let w, h, p, obs, score, hp, gameActive, speed, frame, shakeTime = 0;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            p = { x: 50, y: h - 200, w: 70, h: 110, dy: 0, g: 0.8, jump: -16, onG: false };
            obs = []; score = 0; hp = 100; speed = 7; frame = 0; gameActive = true;
            overlay.style.display = 'none';
            document.getElementById('hp').innerText = '100%';
            requestAnimationFrame(loop);
        }

        function drawWorld() {
            // Фон и пол
            ctx.fillStyle = '#050000'; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#111'; ctx.fillRect(0, h-60, w, 60);
            
            // "Кровавый" туман
            ctx.fillStyle = 'rgba(100, 0, 0, 0.05)';
            for(let i=0; i<3; i++) ctx.fillRect((frame*(1+i))%w, h-150, 200, 100);
        }

        function loop() {
            if(!gameActive) return;
            ctx.save();
            if(shakeTime > 0) { ctx.translate(Math.random()*10-5, Math.random()*10-5); shakeTime--; }
            
            drawWorld();

            // Игрок
            p.dy += p.g; p.y += p.dy;
            if(p.y + p.h > h - 60) { p.y = h - 60 - p.h; p.dy = 0; p.onG = true; }
            ctx.drawImage(imgRunner, p.x, p.y, p.w, p.h);

            // Препятствия
            if(frame % 90 === 0) obs.push({ x: w, y: h - 140, w: 80, h: 80 });
            obs.forEach((o, i) => {
                o.x -= speed;
                ctx.drawImage(imgChaser, o.x, o.y, o.w, o.h);
                
                // Столкновение
                if(p.x < o.x + o.w - 15 && p.x + p.w > o.x + 15 && p.y < o.y + o.h && p.y + p.h > o.y) {
                    obs.splice(i, 1); hp -= 34; shakeTime = 10;
                    document.getElementById('hp').innerText = Math.max(0, hp) + '%';
                    if(hp <= 0) gameOver();
                }
                if(o.x < -100) obs.splice(i, 1);
            });

            // Свет фонарика (атмосфера)
            let grad = ctx.createRadialGradient(p.x+35, p.y+50, 50, p.x+35, p.y+50, 400);
            grad.addColorStop(0, 'rgba(255,255,255,0.05)'); grad.addColorStop(1, 'rgba(0,0,0,0.9)');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

            score++; speed += 0.002; frame++;
            document.getElementById('score').innerText = Math.floor(score/10);
            ctx.restore();
            requestAnimationFrame(loop);
        }

        function gameOver() { gameActive = false; overlay.style.display = 'flex'; if(navigator.vibrate) navigator.vibrate(500); }
        
        function jump() { if(p.onG && gameActive) { p.dy = p.jump; p.onG = false; } }

        window.addEventListener('touchstart', (e) => { if(e.target !== restartBtn) { e.preventDefault(); jump(); } }, {passive: false});
        window.addEventListener('mousedown', (e) => { if(e.target !== restartBtn) jump(); });
        restartBtn.onclick = (e) => { e.stopPropagation(); init(); };

        imgRunner.onload = init;
    </script>
</body>
</html>
